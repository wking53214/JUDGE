[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "judge"
version = "0.4.10"
description = "The third party that decides. Reads the evidence of a whole run and says ACCEPT, REJECT or INSUFFICIENT. Measures nothing, writes nothing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "William N. King" }]
keywords = ["code-quality", "change-control", "verdict"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
# The runtime dependency is CNS, the shared rows (cns.seat) and gate contract (cns.gate).
# It is pinned by release tag, spelled the same way in every repository of the stack (CNS's seat_pins check compares the
# text, and pip treats a tag URL and a commit URL as two sources). The comment names the commit the tag peels to.
dependencies = [
    "cns @ git+https://github.com/wking53214/CNS.git@v2.0.0",  # v2.0.0 = b13e5d2f9e0e4291725f82794b89117c3d840ac1
]

[project.urls]
Homepage = "https://github.com/wking53214/Judge"

[project.scripts]
judge = "judge.cli:main"

[project.optional-dependencies]
# Judge imports no Warden code at runtime. Warden is used only by the tests that seat the Judge in the
# real loop (tests/test_in_the_loop.py, tests/test_contract.py), so it is a test-time extra, not a dependency.
# The pin is a full Warden commit, so a change on Warden main cannot silently break the tests.
# To bump: see "Bumping the Warden pin" in README.md. CI checks out the same commit (.github/workflows/tests.yml);
# tests/test_warden_pin.py fails if the two disagree.
warden = [
    "warden @ git+https://github.com/wking53214/Warden.git@9ecd1124e6c1b1c4ad7daed37b17f9009662dd9d",  # Warden 0.13.10
]
test = ["pytest>=8"]
# Exact versions, so a new release of either cannot turn the lint job red (or hide a finding) on its own.
lint = ["ruff==0.17.1", "mypy==2.4.0"]
dev = ["judge[test,warden,lint]"]

[tool.setuptools]
packages = ["judge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["needs_warden: seats the Judge in the real Warden loop; skipped without Warden unless JUDGE_REQUIRE_WARDEN=1"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["judge"]
strict_equality = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true
