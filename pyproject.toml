[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "judge"
version = "0.3.0"
description = "The third party that decides. Reads the evidence of a whole run and says ACCEPT, REJECT or INSUFFICIENT. Measures nothing, writes nothing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "William N. King" }]
keywords = ["code-quality", "change-control", "verdict"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
# Pinned to a full Warden commit (0.12.0), not a branch, so a change on Warden main cannot silently break this seat.
# To bump: see "Bumping the Warden pin" in README.md.
dependencies = ["warden @ git+https://github.com/wking53214/Warden.git@72e5745d6f9febc4753160bc248badcfb449bc3d",
                "cns @ git+https://github.com/wking53214/CNS.git@v1.9.0"]

[project.urls]
Homepage = "https://github.com/wking53214/Judge"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["judge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
