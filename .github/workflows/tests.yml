name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[lint]"
      - run: ruff check .
      - run: mypy

  # The Judge's runtime needs only CNS. This job installs no Warden, so it proves that, and the tests
  # that need Warden are skipped here with a stated reason (-rs prints it). The warden job below runs them.
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: pytest -q -rs

  # The whole suite against the Warden commit pinned in pyproject.toml (extra "warden"), so the real-loop and
  # contract tests are never silently skipped: JUDGE_REQUIRE_WARDEN=1 turns a missing Warden into a failure.
  # To bump: change the SHA below together with pyproject.toml (tests/test_warden_pin.py fails if they differ).
  warden:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      JUDGE_REQUIRE_WARDEN: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: wking53214/Warden
          ref: cb45681ea80f845fb8f23bb091bda7f587c6a547
          path: _warden
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      # Warden pins CNS by the same release tag as Judge, so a plain install resolves to one CNS.
      - run: pip install ./_warden
      - run: pytest -q -rs
